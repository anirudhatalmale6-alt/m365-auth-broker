<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Sign-in failed</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #f3f4f6; color: #111827; padding: 24px;
  }
  .card {
    background: #fff; max-width: 460px; width: 100%; padding: 40px 36px;
    border-radius: 14px; box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 12px 32px rgba(0,0,0,.09);
    text-align: center;
  }
  .mark {
    width: 56px; height: 56px; margin: 0 auto 20px; border-radius: 50%;
    background: #dc2626; display: grid; place-items: center;
  }
  .mark svg { width: 26px; height: 26px; stroke: #fff; fill: none; stroke-width: 3;
              stroke-linecap: round; }
  h1 { margin: 0 0 8px; font-size: 20px; font-weight: 600; letter-spacing: -.01em; }
  p { margin: 0; color: #6b7280; font-size: 14.5px; }
  .detail {
    margin-top: 22px; padding: 14px 16px; background: #f9fafb; border: 1px solid #e5e7eb;
    border-radius: 9px; font: 12.5px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: #4b5563; text-align: left; word-break: break-word; max-height: 180px; overflow: auto;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #0b0f19; color: #e5e7eb; }
    .card { background: #151b28; box-shadow: 0 12px 32px rgba(0,0,0,.5); }
    p { color: #9aa4b2; }
    .detail { background: #0f1521; border-color: #263041; color: #9aa4b2; }
  }
</style>
</head>
<body>
  <main class="card">
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </div>
    <h1>Sign-in didn't complete</h1>
    <p>You can close this tab and try again from the application.</p>
    <div class="detail">{{detail}}</div>
  </main>
</body>
</html>
