<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Signed in</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #f3f4f6; color: #111827; padding: 24px;
  }
  .card {
    background: #fff; max-width: 420px; width: 100%; padding: 40px 36px;
    border-radius: 14px; box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 12px 32px rgba(0,0,0,.09);
    text-align: center;
  }
  .mark {
    width: 56px; height: 56px; margin: 0 auto 20px; border-radius: 50%;
    background: #16a34a; display: grid; place-items: center;
  }
  .mark svg { width: 28px; height: 28px; stroke: #fff; fill: none; stroke-width: 3;
              stroke-linecap: round; stroke-linejoin: round; }
  h1 { margin: 0 0 8px; font-size: 20px; font-weight: 600; letter-spacing: -.01em; }
  p { margin: 0; color: #6b7280; font-size: 14.5px; }
  .hint { margin-top: 22px; padding-top: 18px; border-top: 1px solid #e5e7eb;
          font-size: 13px; color: #9ca3af; }
  @media (prefers-color-scheme: dark) {
    body { background: #0b0f19; color: #e5e7eb; }
    .card { background: #151b28; box-shadow: 0 12px 32px rgba(0,0,0,.5); }
    p { color: #9aa4b2; }
    .hint { border-top-color: #263041; color: #6b7280; }
  }
</style>
</head>
<body>
  <main class="card">
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M4 12.5l5.5 5.5L20 7"/></svg>
    </div>
    <h1>You're signed in</h1>
    <p>Authentication completed successfully. You can close this tab and return to the application.</p>
    <div class="hint">This window received no access token &mdash; it was delivered directly to the application on your own machine.</div>
  </main>
</body>
</html>
