[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "m365-auth-broker"
version = "1.0.0"
description = "Secure Microsoft 365 OAuth 2.0 broker for desktop applications (loopback + PKCE)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Anirudha Talmale" }]
keywords = ["oauth2", "pkce", "microsoft365", "msgraph", "desktop", "authentication"]

# Deliberately zero runtime dependencies: this process handles mail tokens,
# so the supply chain is kept as small as the standard library allows.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]
keyring = ["keyring>=24.0"]

[project.scripts]
m365-auth = "m365broker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
m365broker = ["pages/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
